id: jcode.ext.sqlclient
name: SQL Client
version: 0.4.0
type: dbmanager
publisher: jcode
authors: [jcode, blamspotdev]
supportedArches: [arm64]
description: A Microsoft SQL Server studio — browse databases in the drawer, then manage tables, run queries, view ER diagrams and security in a full editor-area studio.
api:
  minApiVersion: 1
  capabilities: [exec, config, workbench]
settings:
  - key: sql.server
    label: Server (host,port)
    type: str
    default: localhost,1433
    description: SQL Server address as host,port — e.g. localhost,1433 or a VM's forwarded host port.
  - key: sql.user
    label: Login
    type: str
    default: sa
    description: SQL Server login name.
  - key: sql.password
    label: Password
    type: str
    default: JCodeVm2026.
    description: SQL Server password. Stored locally on this device. The default matches the VM
      Manager's SQL Server setup default — change both if you set your own SA password.
  - key: sql.database
    label: Initial database
    type: str
    default: master
    description: Database used to enumerate the server (the studio opens the one you tap).
  - key: sql.trustCert
    label: Trust server certificate
    type: bool
    default: true
    description: Accept the server's TLS certificate without validation (needed for self-signed certs).
  - key: sql.ssh.mode
    label: Connection method
    type: enum
    default: "off"
    options: ["off", tunnel, ssh]
    description: >-
      How to reach the server. "off" connects straight from this runtime. "tunnel" opens an SSH
      port-forward and connects through it, for a server only its own network can see. "ssh" runs
      sqlcmd on the far side of the SSH connection and brings its output back.
  - key: sql.ssh.host
    label: SSH host
    type: str
    description: The machine to connect to over SSH — a bastion, or the database host itself.
  - key: sql.ssh.port
    label: SSH port
    type: int
    default: 22
  - key: sql.ssh.user
    label: SSH user
    type: str
  - key: sql.ssh.auth
    label: SSH authentication
    type: enum
    default: key
    options: [key, password]
    description: A private key file, or a password. Cloud hosts are usually key-only.
  - key: sql.ssh.key
    label: SSH private key file
    type: str
    description: Path to the key inside the Linux runtime — e.g. /root/.ssh/id_ed25519.
  - key: sql.ssh.passphrase
    label: SSH key passphrase
    type: str
    description: Only if the key is encrypted. Stored locally on this device.
  - key: sql.ssh.password
    label: SSH password
    type: str
    description: Used when authentication is set to password. Stored locally on this device.
  - key: sql.ssh.localPort
    label: Tunnel local port
    type: int
    default: 11433
    description: The near end of the port-forward, which sqlcmd connects to when tunnelling.
requires:
  extensions: []
  sdks: [sqlcmd]

# --- header fields merged from extension.jehm ---
shortDescription: >-
  A SQL Server studio — browse databases in the drawer, then manage tables, run queries, view ER diagrams and security
  in a full editor studio.
minJCodeVersion: 1.0.0
targetJCodeVersion: 1.0.0
category: Databases
subcategory: SQL Server
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
entry:
  manifest: extension.yaml
  libs: []
  # Drawn in JCode's own process rather than a WebView. A bare dex, not an APK: this plugin owns no
  # resources — every icon it draws is one of JCode's own.
  native:
    dex: lib/sqlstudio.dex
    class: dev.blamspot.jcode.ext.sql.SqlExtension
    abi: 7
